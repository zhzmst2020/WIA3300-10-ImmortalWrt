name: Check WIA3300-10 Source

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/uniessey/immortalwrt
  REPO_BRANCH: wia3300-10-support
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install basic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clone WIA3300-10 source
        run: |
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Check actual source version
        run: |
          cd openwrt

          echo "================================"
          echo "WIA3300-10 SOURCE CHECK"
          echo "================================"

          echo ""
          echo "===== GIT COMMIT ====="
          git log -1 --oneline

          echo ""
          echo "===== GIT BRANCH ====="
          git branch --show-current

          echo ""
          echo "===== REMOTE ====="
          git remote -v

          echo ""
          echo "===== VERSION FILE ====="
          if [ -f include/version.mk ]; then
            grep -E 'VERSION_NUMBER|VERSION_CODE|VERSION_NICK|VERSION_REPO' include/version.mk || true
          fi

          echo ""
          echo "===== KERNEL VERSION ====="
          grep -R "KERNEL_PATCHVER" include/ target/ 2>/dev/null | head -20 || true

          echo ""
          echo "===== APK / OPKG ====="
          grep -R "apk" include/ target/ 2>/dev/null | head -20 || true
          grep -R "opkg" include/ target/ 2>/dev/null | head -20 || true

          echo ""
          echo "===== WIA3300-10 TARGET ====="
          find target -iname '*wia3300*' -o -iname '*skspruce*' 2>/dev/null | head -50

          echo ""
          echo "================================"
          echo "CHECK COMPLETE"
          echo "================================"
