name: Build WIA3300-10 Pure - OC PW Dependencies

on:
workflow_dispatch:

env:
REPO_URL: https://github.com/uniessey/immortalwrt
REPO_BRANCH: wia3300-10-support
TZ: Asia/Shanghai

jobs:
build:
runs-on: ubuntu-22.04

steps:

  - name: Checkout workflow repository
    uses: actions/checkout@v4

  - name: Initialize build environment
    env:
      DEBIAN_FRONTEND: noninteractive
    run: |
      sudo -E apt-get update
      sudo -E apt-get install -y \
        build-essential \
        clang \
        flex \
        bison \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libncursesw5-dev \
        libssl-dev \
        python3 \
        python3-distutils \
        python3-setuptools \
        python3-pyelftools \
        rsync \
        unzip \
        wget \
        curl \
        file \
        zstd \
        gzip \
        bzip2 \
        xz-utils \
        p7zip-full \
        patch \
        perl \
        swig \
        time \
        xsltproc \
        libxml-parser-perl \
        libelf-dev \
        ecj \
        fastjar \
        java-propose-classpath \
        quilt \
        libtool \
        autoconf \
        automake \
        pkg-config \
        ccache \
        jq \
        squashfs-tools \
        device-tree-compiler

      sudo timedatectl set-timezone "$TZ"

  - name: Clone ImmortalWrt source
    run: |
      git clone --depth=1 \
        -b "$REPO_BRANCH" \
        "$REPO_URL" \
        openwrt

      cd openwrt

      echo "===== SOURCE ====="
      git log -1 --oneline

      echo "===== BRANCH ====="
      git branch --show-current

  - name: Update feeds
    run: |
      cd openwrt

      ./scripts/feeds update -a
      ./scripts/feeds install -a

  - name: Check required kernel packages
    run: |
      cd openwrt

      echo "===== CHECK NFT SOCKET ====="
      grep -R \
        "KernelPackage/nft-socket" \
        package/kernel/linux/modules \
        2>/dev/null | head -20 || true

      echo "===== CHECK NFT TPROXY ====="
      grep -R \
        "KernelPackage/nft-tproxy" \
        package/kernel/linux/modules \
        2>/dev/null | head -20 || true

      echo "===== CHECK NF SOCKET ====="
      grep -R \
        "KernelPackage/nf-socket" \
        package/kernel/linux/modules \
        2>/dev/null | head -20 || true

      echo "===== CHECK NF TPROXY ====="
      grep -R \
        "KernelPackage/nf-tproxy" \
        package/kernel/linux/modules \
        2>/dev/null | head -20 || true

  - name: Prepare WIA3300-10 configuration
    run: |
      cd openwrt

      cp wia3300-10.config .config

      # ==================================================
      # LuCI / 中文
      # ==================================================

      echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
      echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config

      # ==================================================
      # OpenClash / PassWall 安装环境
      # 注意：这里只装依赖，不装本体
      # ==================================================

      echo 'CONFIG_PACKAGE_luci-compat=y' >> .config

      # nftables 透明代理依赖
      echo 'CONFIG_PACKAGE_kmod-nft-socket=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-nf-socket=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config

      # TUN / 网络诊断
      echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-inet-diag=y' >> .config

      # ==================================================
      # USB / Extroot
      # ==================================================

      echo 'CONFIG_PACKAGE_kmod-usb-core=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-usb2=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-usb-storage=y' >> .config
      echo 'CONFIG_PACKAGE_kmod-usb-storage-extras=y' >> .config
      echo 'CONFIG_PACKAGE_block-mount=y' >> .config
      echo 'CONFIG_PACKAGE_e2fsprogs=y' >> .config
      echo 'CONFIG_PACKAGE_f2fsck=y' >> .config
      echo 'CONFIG_PACKAGE_lsblk=y' >> .config

      # ==================================================
      # 常用网络工具
      # ==================================================

      echo 'CONFIG_PACKAGE_curl=y' >> .config
      echo 'CONFIG_PACKAGE_wget-ssl=y' >> .config
      echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
      echo 'CONFIG_PACKAGE_ip-full=y' >> .config

      # ==================================================
      # 关闭 IPv6
      # ==================================================

      sed -i \
        's/^CONFIG_IPV6=y/# CONFIG_IPV6 is not set/' \
        .config || true

      sed -i \
        's/^CONFIG_KERNEL_IPV6=y/# CONFIG_KERNEL_IPV6 is not set/' \
        .config || true

      sed -i \
        's/^CONFIG_PACKAGE_odhcpd-ipv6only=y/# CONFIG_PACKAGE_odhcpd-ipv6only is not set/' \
        .config || true

      sed -i \
        's/^CONFIG_PACKAGE_odhcp6c=y/# CONFIG_PACKAGE_odhcp6c is not set/' \
        .config || true

      # ==================================================
      # 生成最终配置
      # ==================================================

      make defconfig

      echo "===== FINAL CONFIG CHECK ====="

      grep -E \
        'CONFIG_TARGET_ramips_mt7621=y|CONFIG_TARGET_DEVICE.*wia3300|CONFIG_PACKAGE_luci-compat=|CONFIG_PACKAGE_luci-app-openclash=|CONFIG_PACKAGE_luci-app-passwall=|CONFIG_PACKAGE_kmod-nft-tproxy=|CONFIG_PACKAGE_kmod-nft-socket=|CONFIG_PACKAGE_kmod-nf-tproxy=|CONFIG_PACKAGE_kmod-nf-socket=|CONFIG_PACKAGE_kmod-tun=' \
        .config || true

      echo "===== REQUIRED PACKAGE ASSERTIONS ====="

      for p in \
        CONFIG_PACKAGE_luci-compat=y \
        CONFIG_PACKAGE_kmod-nft-socket=y \
        CONFIG_PACKAGE_kmod-nft-tproxy=y \
        CONFIG_PACKAGE_kmod-nf-socket=y \
        CONFIG_PACKAGE_kmod-nf-tproxy=y; do

        grep -qx "$p" .config || {
          echo "MISSING: $p"
          exit 1
        }

      done

      if grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config; then
        echo "ERROR: OpenClash 本体被选中"
        exit 1
      fi

      if grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config; then
        echo "ERROR: PassWall 本体被选中"
        exit 1
      fi

  - name: Verify target
    run: |
      cd openwrt

      echo "===== TARGET ====="
      grep '^CONFIG_TARGET_ramips' .config | head -20

      echo "===== WIA3300-10 ====="
      grep -i 'wia3300-10' .config | head -20 || true

      echo "===== FIREWALL ====="
      grep -E \
        'CONFIG_PACKAGE_firewall4=|CONFIG_PACKAGE_nftables=' \
        .config || true

  - name: Download source packages
    run: |
      cd openwrt

      make download -j8 V=s

  - name: Build firmware
    id: compile
    run: |
      cd openwrt

      echo "========================================"
      echo " WIA3300-10 PURE BUILD"
      echo " MT7621 / RAMIPS"
      echo " ImmortalWrt wia3300-10-support"
      echo " luci-compat"
      echo " OpenClash / PassWall dependencies"
      echo " NFT SOCKET / NFT TPROXY"
      echo " NO OpenClash"
      echo " NO PassWall"
      echo "========================================"

      make -j2 V=s

      echo "status=success" >> "$GITHUB_OUTPUT"

  - name: Verify package policy in build output
    if: steps.compile.outputs.status == 'success'
    run: |
      cd openwrt

      MANIFEST=$(find bin/targets/ramips/mt7621 \
        -name '*wia3300-10*.manifest' -o -name '*skspruce*.manifest' \
        | head -1)

      test -n "$MANIFEST" || {
        echo "manifest not found"
        exit 1
      }

      echo "===== MANIFEST CHECK ====="

      grep -E \
        '^(luci-compat|kmod-nft-socket|kmod-nft-tproxy|kmod-nf-socket|kmod-nf-tproxy) ' \
        "$MANIFEST" || true

      if grep -q '^luci-app-openclash ' "$MANIFEST"; then
        echo "ERROR: OpenClash 本体进入固件"
        exit 1
      fi

      if grep -q '^luci-app-passwall ' "$MANIFEST"; then
        echo "ERROR: PassWall 本体进入固件"
        exit 1
      fi

      for p in \
        luci-compat \
        kmod-nft-socket \
        kmod-nft-tproxy; do

        grep -q "^$p " "$MANIFEST" || {
          echo "ERROR: manifest 缺少 $p"
          exit 1
        }

      done

      echo "===== PACKAGE POLICY OK ====="

  - name: Show firmware files
    if: steps.compile.outputs.status == 'success'
    run: |
      cd openwrt

      echo "===== FIRMWARE ====="

      find bin/targets/ramips/mt7621 \
        -type f \
        \
          -name '*wia3300-10*' \
          -o -name '*skspruce*' \
        \
        -print

  - name: Verify firmware size
    if: steps.compile.outputs.status == 'success'
    run: |
      cd openwrt

      echo "===== IMAGE SIZE ====="

      find bin/targets/ramips/mt7621 \
        -type f \
        \
          -name '*wia3300-10*.bin' \
          -o -name '*skspruce*.bin' \
        \
        -exec ls -lh {} \;

  - name: Upload firmware
    if: steps.compile.outputs.status == 'success'
    uses: actions/upload-artifact@v4
    with:
      name: WIA3300-10-Pure-OC-PW-Dependencies
      path: |
        openwrt/bin/targets/ramips/mt7621/*wia3300-10*.bin
        openwrt/bin/targets/ramips/mt7621/*skspruce*.bin
      if-no-files-found: error
      retention-days: 15
