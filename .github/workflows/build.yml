name: Build WIA3300-10 Pure - OC PW Dependencies

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/uniessey/immortalwrt
  REPO_BRANCH: wia3300-10-support
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            unzip \
            wget \
            curl \
            file \
            zstd \
            gzip \
            bzip2 \
            xz-utils \
            p7zip-full \
            patch \
            perl \
            swig \
            time \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            quilt \
            libtool \
            autoconf \
            automake \
            pkg-config \
            ccache \
            jq \
            squashfs-tools \
            device-tree-compiler

          sudo timedatectl set-timezone "$TZ"

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 \
            -b "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          cd openwrt

          echo "===== SOURCE ====="
          git log -1 --oneline

          echo "===== BRANCH ====="
          git branch --show-current

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare WIA3300-10 configuration
        run: |
          cd openwrt

          cp wia3300-10.config .config

          echo "===== ADD OC/PW DEPENDENCIES ====="

          # LuCI compatibility
          echo 'CONFIG_PACKAGE_luci-compat=y' >> .config

          # nftables transparent proxy dependencies
          echo 'CONFIG_PACKAGE_kmod-nft-socket=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config

          # Related netfilter modules
          echo 'CONFIG_PACKAGE_kmod-nf-socket=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nf-tproxy=y' >> .config

          # TUN
          echo 'CONFIG_PACKAGE_kmod-tun=y' >> .config

          # Network diagnostics
          echo 'CONFIG_PACKAGE_kmod-inet-diag=y' >> .config

          # USB / extroot
          echo 'CONFIG_PACKAGE_block-mount=y' >> .config
          echo 'CONFIG_PACKAGE_e2fsprogs=y' >> .config
          echo 'CONFIG_PACKAGE_lsblk=y' >> .config

          # Common network tools
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_wget-ssl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_ip-full=y' >> .config

          # Chinese LuCI
          echo 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config

          # IMPORTANT:
          # Do NOT install OpenClash itself.
          # Do NOT install PassWall itself.
          # Do NOT install Xray/Sing-box/Hysteria cores.

          make defconfig

          echo "===== FINAL CONFIG CHECK ====="

          grep -E \
            'CONFIG_TARGET_ramips_mt7621=y|CONFIG_TARGET_DEVICE.*wia3300|CONFIG_PACKAGE_luci-compat=|CONFIG_PACKAGE_luci-app-openclash=|CONFIG_PACKAGE_luci-app-passwall=|CONFIG_PACKAGE_kmod-nft-socket=|CONFIG_PACKAGE_kmod-nft-tproxy=|CONFIG_PACKAGE_kmod-nf-socket=|CONFIG_PACKAGE_kmod-nf-tproxy=|CONFIG_PACKAGE_kmod-tun=' \
            .config || true

          echo "===== CHECK NO OC/PW BODY ====="

          if grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config; then
            echo "ERROR: OpenClash body is enabled"
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config; then
            echo "ERROR: PassWall body is enabled"
            exit 1
          fi

      - name: Verify target
        run: |
          cd openwrt

          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_ramips' .config | head -20

          echo "===== WIA3300-10 ====="
          grep -i 'wia3300-10' .config | head -20 || true

      - name: Download source packages
        run: |
          cd openwrt
          make download -j8 V=s

      - name: Build firmware
        run: |
          cd openwrt

          echo "========================================"
          echo " WIA3300-10 PURE BUILD"
          echo " MT7621 / RAMIPS"
          echo " ImmortalWrt wia3300-10-support"
          echo " luci-compat"
          echo " OC/PW dependencies only"
          echo " NO OpenClash"
          echo " NO PassWall"
          echo "========================================"

          make -j2 V=s

      - name: Verify firmware manifest
        run: |
          cd openwrt

          MANIFEST=$(find bin/targets/ramips/mt7621 \
            -type f \
            -name '*wia3300-10*.manifest' \
            | head -1)

          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find bin/targets/ramips/mt7621 \
              -type f \
              -name '*skspruce*.manifest' \
              | head -1)
          fi

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: manifest not found"
            exit 1
          fi

          echo "===== MANIFEST ====="
          echo "$MANIFEST"

          echo "===== REQUIRED PACKAGES ====="

          grep -E \
            '^(luci-compat|kmod-nft-socket|kmod-nft-tproxy|kmod-nf-socket|kmod-nf-tproxy|kmod-tun) ' \
            "$MANIFEST" || true

          echo "===== CHECK NO OC/PW BODY ====="

          if grep -q '^luci-app-openclash ' "$MANIFEST"; then
            echo "ERROR: OpenClash body found in firmware"
            exit 1
          fi

          if grep -q '^luci-app-passwall ' "$MANIFEST"; then
            echo "ERROR: PassWall body found in firmware"
            exit 1
          fi

          echo "===== MANIFEST CHECK COMPLETE ====="

      - name: Show firmware files
        run: |
          cd openwrt

          echo "===== FIRMWARE FILES ====="

          find bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -name '*wia3300-10*.bin' \
              -o \
              -name '*skspruce*.bin' \
            \) \
            -print

      - name: Verify firmware size
        run: |
          cd openwrt

          echo "===== IMAGE SIZE ====="

          find bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -name '*wia3300-10*.bin' \
              -o \
              -name '*skspruce*.bin' \
            \) \
            -exec ls -lh {} \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10-Pure-OC-PW-Dependencies
          path: |
            openwrt/bin/targets/ramips/mt7621/*wia3300-10*.bin
            openwrt/bin/targets/ramips/mt7621/*skspruce*.bin
          if-no-files-found: error
          retention-days: 15
